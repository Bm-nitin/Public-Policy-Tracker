<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<button class="home-btn" onclick="window.location.href='index.html'">Home</button>

<div class="main-content">
    <div class="form-container sign-in" style="position: relative; margin: 60px auto;">
        <h2>Forgot Password</h2>
        <p style="font-size:0.9em; margin-bottom: 10px;">
            Enter your account email and we'll send you a link to reset your password.
        </p>
        <input type="email" id="forgotEmail" placeholder="Email">
        <button onclick="forgotPassword()">Send Reset Link</button>
        <div id="forgotStatus" style="margin-top:10px; font-size:0.9em;"></div>
        <a href="login.html" style="display:block;margin-top:10px;font-size:0.9em;">Back to Sign In</a>
    </div>
</div>

<footer class="footer">
    <div class="footer-content">
        <p>© 2026 Policy Tracker. All rights reserved.</p>
    </div>
</footer>

<script src="auth.js"></script>

</body>
</html>
