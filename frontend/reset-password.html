<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<button class="home-btn" onclick="window.location.href='index.html'">Home</button>

<div class="main-content">
    <div class="form-container sign-in" style="position: relative; margin: 60px auto;">
        <h2>Reset Password</h2>
        <input type="password" id="newPassword" placeholder="New password (min 8 chars)">
        <input type="password" id="confirmPassword" placeholder="Confirm new password">
        <button onclick="resetPassword()">Reset Password</button>
        <div id="resetStatus" style="margin-top:10px; font-size:0.9em;"></div>
    </div>
</div>

<footer class="footer">

    </div>
</footer>

<script src="auth.js"></script>

</html>
