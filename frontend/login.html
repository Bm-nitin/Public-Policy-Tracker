<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Policy Tracker</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="shared/shared.css">
    <link rel="stylesheet" href="login.css">
</head>
<body data-page="" data-header="simple">

<div id="app-header"></div>

<main class="auth-main">

    <!-- #container / .active is toggled by auth.js's toggle() function
         (unmodified) to switch which panel is visible. -->
    <div class="auth-container" id="container">

        <!-- SIGN IN -->
        <div class="auth-card form-container sign-in card">
            <h2>Welcome back</h2>
            <p class="auth-subtext">Sign in to continue to Policy Tracker.</p>

            <div class="field">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com">
            </div>
            <div class="field">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Your password">
            </div>

            <button onclick="login()" class="btn btn-primary btn-block">Sign In</button>
            <a href="forgot-password.html" class="auth-link">Forgot password?</a>

            <p class="auth-switch">
                Don't have an account?
                <button type="button" class="link-btn" onclick="toggle()">Sign Up</button>
            </p>
        </div>

        <!-- SIGN UP -->
        <div class="auth-card form-container sign-up card">
            <h2>Create your account</h2>
            <p class="auth-subtext">Join Policy Tracker to ask the assistant questions.</p>

            <div class="field">
                <label for="signupName">Name</label>
                <input type="text" id="signupName" placeholder="Your name">
            </div>
            <div class="field">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" placeholder="you@example.com">
            </div>
            <div class="field">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" placeholder="Min 6 characters">
            </div>

            <button onclick="signup()" class="btn btn-primary btn-block">Sign Up</button>

            <p class="auth-switch">
                Already have an account?
                <button type="button" class="link-btn" onclick="toggle()">Sign In</button>
            </p>
        </div>

    </div>

</main>

<div id="app-footer"></div>

<script src="shared/shared.js"></script>
<script src="auth.js"></script>

</body>
</html>
