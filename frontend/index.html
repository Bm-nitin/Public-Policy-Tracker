<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Tracker</title>
    <!-- Prevents a flash of the wrong theme before shared.js runs -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="shared/shared.css">
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="home" data-header="full">

    <div id="app-header"></div>

    <main>
        <div class="hero-wrapper">
            <section class="hero page-container">

                <!-- LEFT -->
                <div class="hero-left">
                    <h1>
                        Track <span>Public Policy Changes</span>
                    </h1>

                    <p>
                        Explore policy updates across sectors like agriculture,
                        healthcare, economy, and technology using an AI chatbot.
                    </p>

                    <div class="hero-buttons">
                        <button onclick="focusInput()" class="btn btn-primary">
                            Ask a Question
                        </button>

                        <button onclick="sendCategory('healthcare')" class="btn btn-secondary">
                            Healthcare
                        </button>
                    </div>

                    <!-- Real buttons (were clickable spans): keyboard- and
                         screen-reader-operable, with a proper touch target. -->
                    <div class="quick-topics" role="group" aria-label="Quick topics">
                        <button type="button" class="quick-topic" onclick="sendCategory('agriculture')">Agriculture</button>
                        <button type="button" class="quick-topic" onclick="sendCategory('education')">Education</button>
                        <button type="button" class="quick-topic" onclick="sendCategory('technology')">Technology</button>
                        <button type="button" class="quick-topic" onclick="sendCategory('economy')">Economy</button>
                    </div>
                </div>

                <!-- RIGHT CHAT -->
                <div class="hero-right">

                    <div class="chat-card card">

                        <div class="chat-card__header">
                            <span class="badge"><span class="badge-dot"></span>Policy Assistant · Online</span>
                        </div>

                        <div id="chatbox" role="log" aria-live="polite" aria-label="Conversation with the policy assistant"></div>

                        <div class="input-area">
                            <input type="text" id="userInput" placeholder="Ask about policies..." aria-label="Your question" autocomplete="off" enterkeyhint="send">
                            <button onclick="sendMessage()" class="btn btn-primary" aria-label="Send message">➤</button>
                        </div>

                    </div>

                </div>

            </section>
        </div>
    </main>

    <div id="app-footer"></div>

    <script src="shared/shared.js"></script>
    <script src="script.js"></script>

</body>

</html>
