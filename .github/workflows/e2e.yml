name: Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium workflows and cross-browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHON_DOTENV_DISABLED: "1"
      DATABASE_URL: ""
      MAIL_HOST: ""
      GEMINI_API_KEY: ""

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements.txt
            requirements-dev.txt
            requirements-e2e.txt

      - name: Install locked Python dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-dev.txt -r requirements-e2e.txt
          python -m pip check

      - name: Prepare PostgreSQL 16 binaries
        run: |
          pg_bin=/usr/lib/postgresql/16/bin
          if [[ ! -x "$pg_bin/initdb" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-16
          fi
          for program in postgres initdb pg_ctl; do
            test -x "$pg_bin/$program"
          done
          echo "POLICY_TRACKER_TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"

      - name: Install Playwright browser engines
        id: browsers
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Run Chromium workflows
        run: |
          reports="$RUNNER_TEMP/e2e-reports"
          mkdir -p "$reports"
          POLICY_E2E_ARTIFACTS="$reports/chromium-failures" \
            python -m pytest e2e --browser chromium -ra --tb=short \
              --tracing=off --video=off --screenshot=off \
              --output "$RUNNER_TEMP/chromium-plugin" --basetemp "$RUNNER_TEMP/chromium-e2e" \
              --junitxml "$reports/chromium.xml"

      - name: Run Firefox and WebKit smoke tests
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: |
          reports="$RUNNER_TEMP/e2e-reports"
          mkdir -p "$reports"
          POLICY_E2E_ARTIFACTS="$reports/smoke-failures" \
            python -m pytest e2e -m cross_browser --browser firefox --browser webkit -ra --tb=short \
              --tracing=off --video=off --screenshot=off \
              --output "$RUNNER_TEMP/smoke-plugin" --basetemp "$RUNNER_TEMP/smoke-e2e" \
              --junitxml "$reports/smoke.xml"

      - name: Upload browser reports and safe failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: ${{ runner.temp }}/e2e-reports
          if-no-files-found: warn
          retention-days: 7
