<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Policy Tracker</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="shared/shared.css">
    <link rel="stylesheet" href="login.css">
</head>
<body data-page="" data-header="simple">

<div id="app-header"></div>

<main class="auth-main">
    <div class="auth-container">
        <div class="form-container sign-in card">
            <h2>Reset Password</h2>

            <div class="field">
                <label for="newPassword">New password</label>
                <input type="password" id="newPassword" placeholder="Min 8 characters">
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter new password">
            </div>

            <button onclick="resetPassword()" class="btn btn-primary btn-block">Reset Password</button>
            <div id="resetStatus" class="form-status" style="margin-top: 12px;"></div>
        </div>
    </div>
</main>

<div id="app-footer"></div>

<script src="shared/shared.js"></script>
<script src="auth.js"></script>

</body>
</html>
