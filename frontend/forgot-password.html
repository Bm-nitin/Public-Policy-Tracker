<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Policy Tracker</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="shared/shared.css">
    <link rel="stylesheet" href="login.css">
</head>
<body data-page="" data-header="simple">

<div id="app-header"></div>

<main class="auth-main">
    <div class="auth-container">
        <div class="form-container sign-in card">
            <h2>Forgot Password</h2>
            <p class="auth-subtext">
                Enter your account email and we'll send you a link to reset your password.
            </p>

            <div class="field">
                <label for="forgotEmail">Email</label>
                <input type="email" id="forgotEmail" placeholder="you@example.com">
            </div>

            <button onclick="forgotPassword()" class="btn btn-primary btn-block">Send Reset Link</button>
            <div id="forgotStatus" class="form-status" style="margin-top: 12px;"></div>
            <a href="login.html" class="auth-link">Back to Sign In</a>
        </div>
    </div>
</main>

<div id="app-footer"></div>

<script src="shared/shared.js"></script>
<script src="auth.js"></script>

</body>
</html>
