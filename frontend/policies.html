<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policies | Policy Tracker</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="shared/shared.css">
    <link rel="stylesheet" href="policies.css">
</head>

<body data-page="policies" data-header="full">

    <div id="app-header"></div>

    <main class="page-container policies-page">

        <div class="policies-heading">
            <h1>Policies</h1>
            <p>Browse tracked public policies by sector, category, and sub-category.</p>
        </div>

        <div class="policies-toolbar card">
            <div class="policies-search">
                <input type="search" id="policySearch" placeholder="Search policies..." aria-label="Search policies">
            </div>
            <div class="policies-filters">
                <select id="sectorFilter" aria-label="Filter by sector">
                    <option value="">All sectors</option>
                </select>
                <select id="categoryFilter" aria-label="Filter by category">
                    <option value="">All categories</option>
                </select>
                <select id="subCategoryFilter" aria-label="Filter by sub-category">
                    <option value="">All sub-categories</option>
                </select>
                <button type="button" id="clearFiltersBtn" class="btn btn-ghost">Clear Filters</button>
            </div>
        </div>

        <div class="policies-count text-muted" id="policiesCount" aria-live="polite"></div>

        <!-- Populated by policies.js. Loading / error / empty states all
             render inside this same container so only one is visible at
             a time. -->
        <div class="policies-grid" id="policiesGrid" aria-live="polite"></div>

        <nav class="policies-pagination" id="policiesPagination" aria-label="Policy pages"></nav>

    </main>

    <div id="app-footer"></div>

    <!-- Policy detail modal -->
    <div class="policy-modal-overlay" id="policyModalOverlay" hidden>
        <div class="policy-modal card" role="dialog" aria-modal="true" aria-labelledby="policyModalTitle">
            <button type="button" class="policy-modal__close" id="policyModalClose" aria-label="Close details">&times;</button>
            <div id="policyModalBody">
                <!-- Filled by policies.js. Never built with innerHTML from
                     raw API text - see policies.js for details. -->
            </div>
        </div>
    </div>

    <script src="shared/shared.js"></script>
    <script src="policies.js"></script>

</body>

</html>
